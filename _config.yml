# ChinaOps Jekyll Configuration
title: ChinaOps
description: Technical Runbook for Travelers & Parents
author: TechDadShanghai
url: "https://MilesXLab.github.io"
baseurl: "/ChinaOps"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    ndash: "-"
    mdash: "-"

permalink: pretty

# Exclude from build
exclude:
- .gitignore
- CONTRIBUTING.md
- README.md
- ROADMAP.md
- LEGAL_NOTICE.md
- scripts/
- .qodo/
- vendor/
- Gemfile
- Gemfile.lock
- node_modules/

# Custom settings
show_downloads: false
