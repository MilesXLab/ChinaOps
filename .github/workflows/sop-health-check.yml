name: SOP Health Check (TTL Audit)

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TTL Audit
        run: |
          python scripts/ttl_check.py
        id: audit

      - name: Report Failures
        if: failure()
        run: |
          echo "SOPs have expired or have missing metadata! Please check the audit logs."
