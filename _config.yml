# ChinaOps Jekyll Configuration
title: ChinaOps
description: Technical Runbook for Travelers & Parents
author: TechDadShanghai
# Canonical host must match the live GH Pages hostname (lowercase).
url: "https://milesxlab.github.io"
baseurl: "/ChinaOps"
lang: en
author: TechDadShanghai

# Build settings
markdown: kramdown
# theme: jekyll-theme-minimal  # Using custom layout in _layouts/
permalink: pretty

# Exclude from build
exclude:
- .gitignore
- CONTRIBUTING.md
- README.md
- ROADMAP.md
- LEGAL_NOTICE.md
- CHANGELOG.md
- requirements.txt
- scripts/
- .qodo/
- vendor/
- Gemfile
- Gemfile.lock
- node_modules/

# Custom settings
show_downloads: false
