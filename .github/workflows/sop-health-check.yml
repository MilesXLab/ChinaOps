name: SOP Health Check (TTL Audit)

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TTL Audit
        run: |
          python scripts/ttl_check.py
        id: audit

      - name: Catalog sync (index.json ↔ docs)
        run: |
          python scripts/check_catalog.py

      - name: Link check
        run: |
          python scripts/verify_links.py

      - name: Rebuild fulltext JSON
        run: |
          python scripts/build_fulltext_index.py

      - name: Static entry assets
        run: |
          python scripts/check_static_assets.py

      - name: Report Failures
        if: failure()
        run: |
          echo "SOP health failed: expired/missing metadata, catalog drift, broken links, or missing static assets."
